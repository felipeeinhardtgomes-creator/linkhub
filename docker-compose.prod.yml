services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkhub}
      POSTGRES_DB: ${POSTGRES_DB:-linkhub}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkhub}:${POSTGRES_PASSWORD:-linkhub}@db:5432/${POSTGRES_DB:-linkhub}?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  db_data:
